[package]
name = "axum-sqlite-starter"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Axum + SQLx (SQLite) JSON API starter: health endpoint, notes CRUD, migrations on boot, tests."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
